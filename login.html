```html
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>로그인 - 책방</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="auth-main">

        <section class="auth-card">

            <div class="auth-logo">
                📚 책방
            </div>

            <h1 id="authTitle">
                책방에 들어오세요
            </h1>

            <p
                class="auth-description"
                id="authDescription"
            >
                로그인하고 사람들과 책 이야기를 나눠보세요.
            </p>


            <!-- 로그인 -->

            <form id="loginForm">

                <input
                    id="loginEmail"
                    type="email"
                    placeholder="이메일"
                    autocomplete="email"
                    required
                >

                <input
                    id="loginPassword"
                    type="password"
                    placeholder="비밀번호"
                    autocomplete="current-password"
                    required
                >

                <button type="submit">
                    로그인
                </button>

            </form>


            <!-- 회원가입 -->

            <form
                id="signupForm"
                style="display: none;"
            >

                <input
                    id="signupEmail"
                    type="email"
                    placeholder="이메일"
                    autocomplete="email"
                    required
                >

                <input
                    id="signupPassword"
                    type="password"
                    placeholder="비밀번호 (6자 이상)"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

                <input
                    id="signupNickname"
                    type="text"
                    placeholder="닉네임 (2~20자)"
                    autocomplete="nickname"
                    minlength="2"
                    maxlength="20"
                    required
                >

                <button type="submit">
                    회원가입
                </button>

            </form>


            <p
                id="authMessage"
                class="auth-message"
                aria-live="polite"
            ></p>


            <button
                type="button"
                id="toggleAuth"
                class="auth-toggle"
            >
                계정이 없으신가요? 회원가입
            </button>

        </section>

    </main>


    <!-- Supabase CDN 없음 -->
    <script src="auth.js"></script>

</body>
</html>
```
