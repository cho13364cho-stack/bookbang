<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>책방</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         Header
    ========================== -->

    <header class="site-header">

        <a href="index.html" class="logo">
            📚 책방
        </a>

        <p class="header-description">
            책을 좋아하는 사람들이 모이는 공간
        </p>

    </header>


    <!-- =========================
         Main
    ========================== -->

    <main class="home-main">

        <section class="hero">

            <p class="hero-label">
                BOOK COMMUNITY
            </p>

            <h1>
                어떤 책에 대해<br>
                이야기해볼까요?
            </h1>

            <p class="hero-description">
                좋아하는 책을 골라<br>
                같은 책을 읽은 사람들과 이야기를 나눠보세요.
            </p>

        </section>


        <!-- 책 목록 -->

        <section class="books-section">

            <div class="section-header">

                <h2>
                    책방
                </h2>

                <span id="bookCount">
                    0권
                </span>

            </div>


            <div
                class="book-list"
                id="bookList"
            ></div>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
